name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: pptx-tool-linux-amd64
            executable: pptx-tool
          - os: macos-latest
            asset_name: pptx-tool-macos-amd64
            executable: pptx-tool
          - os: windows-latest
            asset_name: pptx-tool-windows-amd64.exe
            executable: pptx-tool.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Build release binary
        run: cargo build --release

      - name: Prepare binary (Linux and macOS)
        if: runner.os != 'Windows'
        run: mv target/release/${{ matrix.executable }} ${{ matrix.asset_name }}

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: Move-Item -Path target\release\${{ matrix.executable }} -Destination ${{ matrix.asset_name }}

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
