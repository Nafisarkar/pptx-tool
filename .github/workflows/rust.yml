name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Optional: Add 'fail-fast: false' so if one OS fails, the others keep building
      fail-fast: false 
      matrix:
        include:
          - os: windows-latest
            asset_name: pptx-tool-windows-amd64.exe
            executable: pptx-tool.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup update stable && rustup default stable

      - name: Build release binary
        run: cargo build --release

      - name: Prepare binary (Windows)
        if: runner.os == 'Windows'
        run: Move-Item -Path target\release\${{ matrix.executable }} -Destination ${{ matrix.asset_name }}

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          # If run manually, generate a tag based on the run ID. Otherwise, use the actual release tag.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('pptx-tool-{0}', github.run_id) || github.event.release.tag_name }}
          files: ${{ matrix.asset_name }}
